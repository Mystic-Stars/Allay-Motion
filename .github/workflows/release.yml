# 发版（docs/decisions.md M8、“macOS 构建”）：推 v* 标签或手动触发时，同时构建 Windows 的 NSIS 安装包（x64）和
# macOS 的 dmg、zip（arm64、x64 各一份，各在对应架构的机器上构建），上传为工作流产物。
# 推 v* 标签时，全部安装包和一份合并的 SHA-256 校验和（SHA256SUMS.txt）上传成功后，自动正式发布。
#
# - 只有推送 v* 标签才会公开 Release（标签权限由 GitHub 管理）；手动触发只构建和上传工作流产物。
# - 先建草稿并挂上全部附件，随后立即自动发布；三份构建里任何一份失败、或缺文件的版本不会公开。
# - 没有代码签名证书（H-SIGN），工作流里没有任何证书或密钥：Windows 安装包不签名；macOS 只做 ad-hoc 签名、不公证。
#   electron-builder 的 publish 为 null；应用内的自动更新（docs/decisions.md“自动更新”）直接读 Release 里的安装包和
#   SHA256SUMS.txt，按文件名挑安装包，所以附件的文件名格式不要随意改。
# - macOS 的 FFmpeg 没有可用的 LGPL 预编译包，由 pnpm ffmpeg:fetch 从官方源码编译（scripts/ffmpeg-macos.ts），
#   编译结果按配方的哈希缓存；用缓存时 ffmpeg:fetch 仍重跑许可和依赖的核对。
# - 悦灵的图集和图标用仓库里提交的烘焙产物（packages/mascot/generated），不从 Mojang 下载、不现场烘焙。
# - 权限最小化：构建作业只读仓库；只有发布作业有 contents: write，用的是 GitHub 自带的 GITHUB_TOKEN。
# - 第三方 action 固定到提交哈希（注释里是版本标签）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # 一份失败时其余照常跑完（看得到全部日志）；三份都成功才发布
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64, label: Windows x64 }
          - { os: macos-15, platform: mac, arch: arm64, label: macOS arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64, label: macOS x64 }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 版本
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 apps/desktop/package.json 的 version ($version) 不一致；请先更新桌面包版本。"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # macOS：编译 FFmpeg 要的工具（只在编译时用，不进安装包）。x64 的汇编优化要 nasm
      - name: 编译工具（macOS）
        if: matrix.platform == 'mac'
        run: |
          command -v pkg-config || brew install pkgconf
          if [ "${{ matrix.arch }}" = "x64" ]; then command -v nasm || brew install nasm; fi
          clang --version | head -1

      # 键是配方（scripts/ffmpeg-build.ts、scripts/ffmpeg-macos.ts）的哈希：配方一变就重新编译
      - name: FFmpeg 编译缓存（macOS）
        if: matrix.platform == 'mac'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ffmpeg/darwin-${{ matrix.arch }}
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('scripts/ffmpeg-build.ts', 'scripts/ffmpeg-macos.ts') }}

      # 固定版本的 FFmpeg（校验 SHA-256），随安装包分发（LGPL，许可全文一起带上）。
      # Windows 下载 FFmpeg-Builds 的 win64-lgpl；macOS 从官方源码编译
      - name: pnpm ffmpeg:fetch
        run: pnpm ffmpeg:fetch

      # 导出的编码与回读（docs/05-export.md 5.10）在这里编译的 FFmpeg 上跑一遍，H.264 走 VideoToolbox。
      # macOS 不在日常 CI 里（ci.yml 只有 Windows），这是导出在 macOS 上唯一的自动验证
      - name: pnpm test:export（macOS）
        if: matrix.platform == 'mac'
        run: pnpm test:export

      # pnpm dist：打包（scripts/dist.mjs 按这台机器选平台和架构），然后跑打包后的检查
      # （tests/dist：fuses、安装包内容、签名、冷启动）。
      # T-ARC-7 在这台共享机器上只记数字、不按预算判定：它不是参考机器（docs/decisions.md M8）
      - name: pnpm dist
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ALLAY_T_ARC_7_REPORT_ONLY: '1'
          ALLAY_DIST_SCREENSHOT_DIR: ${{ github.workspace }}/test-results/screenshots

      - name: 校验和（Windows）
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter '*-x64-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw '没有找到安装包' }
          # 发布资产的文件名里不能有空格：GitHub 上传时会把空格换成点，SHA256SUMS.txt 里的名字就对不上了
          $exe = Rename-Item $exe.FullName ($exe.Name -replace ' ', '-') -PassThru
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "apps/desktop/release/checksums-win-x64.txt"
          "安装包：$($exe.Name)，$([math]::Round($exe.Length / 1MB, 1)) MiB，SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: 校验和（macOS）
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          out="checksums-mac-${{ matrix.arch }}.txt"
          : > "$out"
          for f in *-${{ matrix.arch }}.dmg *-${{ matrix.arch }}-mac.zip; do
            [ -f "$f" ] || { echo "没有找到 $f"; exit 1; }
            # 同 Windows：资产文件名去掉空格
            n="${f// /-}"
            [ "$f" = "$n" ] || mv "$f" "$n"
            h=$(shasum -a 256 "$n" | cut -d' ' -f1)
            echo "$h  $n" >> "$out"
            # 变量后紧跟全角字符时要写成 ${n}：macOS 自带的 bash 3.2 会把多字节字符当成变量名的一部分
            echo "${n}：$(( $(stat -f%z "$n") / 1048576 )) MiB，SHA-256 ${h}" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*-x64-setup.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac.zip
            apps/desktop/release/checksums-*.txt
          if-no-files-found: error
          retention-days: 30

      # macOS 冒烟检查（T-ARC-7）第一次启动时的截图：给人看窗口按钮和顶栏，不进 Release
      - name: 上传截图（macOS）
        if: always() && matrix.platform == 'mac'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-mac-${{ matrix.arch }}
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # needs: build 等矩阵里三份构建都成功；任何一份失败，这个作业不运行
  publish-release:
    name: 正式发布 Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # 三份构建各自的校验和合成一份 SHA256SUMS.txt（按文件名排序）
      - name: 合并校验和
        working-directory: dist
        run: |
          set -euo pipefail
          cat checksums-*.txt | tr -d '\r' | sort -k2 > SHA256SUMS.txt
          rm checksums-*.txt
          for f in *-x64-setup.exe *-arm64.dmg *-x64.dmg *-arm64-mac.zip *-x64-mac.zip; do
            [ -f "$f" ] || { echo "缺少 $f"; exit 1; }
          done
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 先建草稿挂上全部附件，再改为公开：公开时附件已经齐全
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'EOF'
          > **NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.**
          > 本软件不是 Minecraft 官方产品，未经 Mojang 或 Microsoft 批准，也与它们无关。

          发布清单（`docs/release-checklist.md`）记录了品牌、名称、代码签名等事项的状态。

          - Windows（x64）：`*-x64-setup.exe`。安装包**没有代码签名**：Windows SmartScreen 会提示“未知发布者”。
            安装时临时文件夹所在的磁盘（通常是 C 盘）至少要有 1 GB 可用空间，不够时安装程序会提示并退出。
          - macOS：Apple 芯片选 `*-arm64.dmg`，Intel 选 `*-x64.dmg`（同样内容的 `*-mac.zip` 也一并提供），需要 macOS 12 或更新。
            应用只做了 ad-hoc 签名、**没有经过 Apple 公证**：首次打开时系统会拦下。在“访达”里右键（或按住 Control 点按）应用选“打开”；
            macOS 15 起要到“系统设置 → 隐私与安全性”里点“仍要打开”。
          - 校验和见 `SHA256SUMS.txt`。
          - 更新记录见 `CHANGELOG.md`。
          EOF
          pre=()
          latest=(--latest=false)
          if [[ "${TAG%%+*}" == *-* ]]; then pre=(--prerelease); fi
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then latest=(); fi
          gh release create "$TAG" dist/*-x64-setup.exe dist/*.dmg dist/*-mac.zip dist/SHA256SUMS.txt --draft --verify-tag --target "$SHA" --title "$TAG" --notes-file notes.md "${pre[@]}" "${latest[@]}"
          gh release edit "$TAG" --draft=false "${pre[@]}" "${latest[@]}"
